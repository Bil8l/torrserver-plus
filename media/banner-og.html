<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TorrServer ++ brand card</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #212324;
      --color-ink:     #f1eff3;
      --color-muted:   #a9b2b7;
      --color-soft:    #8a949a;
      --color-accent:  #7be3c3;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1200px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">TorrServer ++ · Brand Card</p>
    <h1>TorrServer ++</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1200 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner-og-title banner-og-desc">
        <title id="banner-og-title">TorrServer ++</title>
        <desc id="banner-og-desc">Brand card for the TorrServer ++ userscript: fast watching and easy copying on top of the original TorrServer web UI.</desc>
        <rect width="100%" height="100%" fill="#212324"/>

        <!-- watermark motif -->
        <text x="1136" y="500" font-family="'Instrument Serif', serif" font-size="360" fill="#7be3c3" opacity="0.05" text-anchor="end">++</text>

        <!-- header block -->
        <text x="64" y="100" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em" fill="#a9b2b7">BROWSER USERSCRIPT · TORRSERVER WEB UI · MIT LICENSE</text>
        <text x="64" y="180" font-family="'Instrument Serif', serif" font-size="40" fill="#f1eff3">TorrServer ++</text>
        <text x="64" y="216" font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#a9b2b7">Fast watching and easy copying, on top of the original TorrServer UI.</text>

        <!-- feature chips -->
        <rect x="64" y="272" width="204" height="28" rx="2" fill="rgba(241,239,243,0.04)" stroke="rgba(241,239,243,0.28)" stroke-width="1"/>
        <circle cx="84" cy="286" r="3.5" fill="#7be3c3"/>
        <text x="100" y="290" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#f1eff3">COPY LINK · EPISODE PICKS</text>

        <rect x="284" y="272" width="208" height="28" rx="2" fill="rgba(241,239,243,0.04)" stroke="rgba(241,239,243,0.28)" stroke-width="1"/>
        <circle cx="304" cy="286" r="3.5" fill="#c983cd"/>
        <text x="320" y="290" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#f1eff3">QUICK ADD · HASH TO MAGNET</text>

        <rect x="508" y="272" width="116" height="28" rx="2" fill="rgba(241,239,243,0.04)" stroke="rgba(241,239,243,0.28)" stroke-width="1"/>
        <circle cx="528" cy="286" r="3.5" fill="#a9b2b7"/>
        <text x="544" y="290" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#f1eff3">OPEN IN MPV</text>

        <!-- footer line -->
        <text x="64" y="560" font-family="'Geist Mono', monospace" font-size="9" fill="#8a949a">github.com/Bil8l/torrserver-plus</text>
        <text x="1136" y="560" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#8a949a" text-anchor="end">MPV BUTTONS NEED MPV-HANDLER</text>
      </svg>
    </div>
  </div>
</body>
</html>
