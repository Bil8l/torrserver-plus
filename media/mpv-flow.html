<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the MPV button opens a stream</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #212324;
      --color-ink:     #f1eff3;
      --color-muted:   #a9b2b7;
      --color-soft:    #8a949a;
      --color-accent:  #7be3c3;
      --color-link:    #c983cd;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">TorrServer ++ · MPV Playback</p>
    <h1>How the MPV button opens a stream</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mpv-flow-title mpv-flow-desc">
        <title id="mpv-flow-title">MPV playback flow</title>
        <desc id="mpv-flow-desc">Flow of the MPV button: a left click builds a playlist link and a right click picks a single episode, the userscript wraps the link in an mpv-handler protocol URL, the operating system hands it to the mpv-handler app, and mpv starts streaming.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9b2b7"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7be3c3"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#212324"/>

        <!-- arrows first -->
        <path d="M 204 244 L 220 244 Q 228 244 228 236 L 228 184 Q 228 176 236 176 L 252 176" fill="none" stroke="#a9b2b7" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 204 268 L 220 268 Q 228 268 228 276 L 228 328 Q 228 336 236 336 L 252 336" fill="none" stroke="#a9b2b7" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 372 176 L 388 176 Q 396 176 396 184 L 396 236 Q 396 244 404 244 L 420 244" fill="none" stroke="#a9b2b7" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 372 336 L 388 336 Q 396 336 396 328 L 396 276 Q 396 268 404 268 L 420 268" fill="none" stroke="#a9b2b7" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="540" y1="256" x2="588" y2="256" stroke="#a9b2b7" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="708" y1="256" x2="756" y2="256" stroke="#7be3c3" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- accent arrow label -->
        <rect x="712" y="236" width="40" height="12" rx="2" fill="#212324"/>
        <text x="732" y="245" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#7be3c3" text-anchor="middle">LAUNCH</text>

        <!-- nodes -->
        <rect x="84" y="224" width="120" height="64" rx="6" fill="#212324"/>
        <rect x="84" y="224" width="120" height="64" rx="6" fill="rgba(169,178,183,0.10)" stroke="#8a949a" stroke-width="1"/>
        <rect x="92" y="230" width="36" height="12" rx="2" fill="transparent" stroke="rgba(138,148,154,0.40)" stroke-width="0.8"/>
        <text x="110" y="239" fill="rgba(138,148,154,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLICK</text>
        <text x="144" y="258" fill="#f1eff3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MPV button</text>
        <text x="144" y="274" fill="#a9b2b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cards · dialog</text>

        <rect x="252" y="144" width="120" height="64" rx="6" fill="#212324"/>
        <rect x="252" y="144" width="120" height="64" rx="6" fill="#323637" stroke="rgba(241,239,243,0.45)" stroke-width="1"/>
        <rect x="260" y="150" width="36" height="12" rx="2" fill="transparent" stroke="rgba(123,227,195,0.40)" stroke-width="0.8"/>
        <text x="278" y="159" fill="rgba(123,227,195,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LEFT</text>
        <text x="312" y="178" fill="#f1eff3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Playlist link</text>
        <text x="312" y="194" fill="#a9b2b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.m3u · all files</text>

        <rect x="252" y="304" width="120" height="64" rx="6" fill="#212324"/>
        <rect x="252" y="304" width="120" height="64" rx="6" fill="#323637" stroke="rgba(241,239,243,0.45)" stroke-width="1"/>
        <rect x="260" y="310" width="40" height="12" rx="2" fill="transparent" stroke="rgba(123,227,195,0.40)" stroke-width="0.8"/>
        <text x="280" y="319" fill="rgba(123,227,195,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RIGHT</text>
        <text x="312" y="338" fill="#f1eff3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Episode link</text>
        <text x="312" y="354" fill="#a9b2b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">direct · one file</text>

        <rect x="420" y="224" width="120" height="64" rx="6" fill="#212324"/>
        <rect x="420" y="224" width="120" height="64" rx="6" fill="#323637" stroke="rgba(241,239,243,0.45)" stroke-width="1"/>
        <rect x="428" y="230" width="36" height="12" rx="2" fill="transparent" stroke="rgba(241,239,243,0.30)" stroke-width="0.8"/>
        <text x="446" y="239" fill="rgba(241,239,243,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUILD</text>
        <text x="480" y="258" fill="#f1eff3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Protocol URL</text>
        <text x="480" y="274" fill="#a9b2b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mpv-handler://…</text>

        <rect x="588" y="224" width="120" height="64" rx="6" fill="#212324"/>
        <rect x="588" y="224" width="120" height="64" rx="6" fill="#323637" stroke="rgba(241,239,243,0.45)" stroke-width="1"/>
        <rect x="596" y="230" width="36" height="12" rx="2" fill="transparent" stroke="rgba(241,239,243,0.30)" stroke-width="0.8"/>
        <text x="614" y="239" fill="rgba(241,239,243,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPEN</text>
        <text x="648" y="258" fill="#f1eff3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mpv-handler</text>
        <text x="648" y="274" fill="#a9b2b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OS protocol app</text>

        <rect x="756" y="224" width="120" height="64" rx="6" fill="#212324"/>
        <rect x="756" y="224" width="120" height="64" rx="6" fill="#571358" stroke="rgba(201,131,205,0.60)" stroke-width="1"/>
        <rect x="764" y="230" width="32" height="12" rx="2" fill="transparent" stroke="rgba(201,131,205,0.50)" stroke-width="0.8"/>
        <text x="780" y="239" fill="rgba(201,131,205,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAY</text>
        <text x="816" y="258" fill="#f1eff3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mpv player</text>
        <text x="816" y="274" fill="#a9b2b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stream starts</text>

        <!-- callout -->
        <text x="84" y="470" font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#f1eff3">one-time setup: install mpv-handler on the machine that runs the browser</text>
        <path d="M 420 458 Q 580 430 640 314" fill="none" stroke="rgba(241,239,243,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="640" cy="312" r="2" fill="#f1eff3"/>

        <!-- legend -->
        <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(241,239,243,0.10)" stroke-width="0.8"/>
        <text x="40" y="572" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#a9b2b7">LEGEND</text>
        <line x1="120" y1="569" x2="160" y2="569" stroke="#a9b2b7" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="168" y="572" font-family="'Geist Mono', monospace" font-size="8" fill="#8a949a">IN THE BROWSER</text>
        <line x1="300" y1="569" x2="340" y2="569" stroke="#7be3c3" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="348" y="572" font-family="'Geist Mono', monospace" font-size="8" fill="#8a949a">HANDOFF TO MPV</text>
        <rect x="480" y="562" width="16" height="10" rx="2" fill="#571358" stroke="rgba(201,131,205,0.60)" stroke-width="0.8"/>
        <text x="504" y="572" font-family="'Geist Mono', monospace" font-size="8" fill="#8a949a">MPV SIDE</text>
      </svg>
    </div>
  </div>
</body>
</html>
