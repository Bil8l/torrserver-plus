<script>
(function () {
  'use strict'
  const P = 12
  const $ = id => document.getElementById(id)
  const world = $('world')
  const NS = 'http://www.w3.org/2000/svg'

  // closed-form underdamped spring step: 0 -> 1, settles to 1
  function S (u, w, z) {
    if (u <= 0) return 0
    if (u > 4 / w) return 1
    const wd = w * Math.sqrt(1 - z * z)
    return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + (z * w / wd) * Math.sin(wd * u))
  }
  // in-cycle chain: value sits at keys[i-1] until keys[i] fires, then springs
  function chain (t, keys) {
    let v = keys[0][1]
    for (let i = 1; i < keys.length; i++) {
      if (t >= keys[i][0]) v += (keys[i][1] - keys[i - 1][1]) * S(t - keys[i][0], keys[i][2] || 14, keys[i][3] || 0.68)
    }
    return v
  }
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v))
  const smooth = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u) }
  const easeOutC = u => { u = clamp(u, 0, 1); return 1 - Math.pow(1 - u, 3) }

  // camera: cx, cy, view width  (w of destination leg carries its own spring)
  const CAM = [
    [0.00, 960, 540, 1920, 8],
    [2.00, 1060, 400, 720, 8],
    [4.20, 1080, 490, 940, 8],
    [6.05, 1480, 830, 1000, 8],
    [7.06, 1360, 420, 1020, 9],
    [9.10, 1100, 730, 1320, 8],
    [10.00, 1220, 412, 900, 9],
    [10.55, 1518, 780, 840, 10],
    [11.30, 960, 540, 1920, 11]
  ]
  function camAt (t) {
    const out = [960, 540, 1920]
    for (let i = 1; i < CAM.length; i++) {
      if (t >= CAM[i][0]) {
        const s = S(t - CAM[i][0], CAM[i][4], 0.82)
        for (let k = 0; k < 3; k++) out[k] += (CAM[i][k + 1] - CAM[i - 1][k + 1]) * s
      }
    }
    return out
  }

  // cursor path (world coords), non-uniform Catmull-Rom through keyframes, wraps at P
  const KEYS = [
    [0.00, -80, 1150], [1.20, 700, 700], [2.20, 1092, 430], [2.60, 1092, 434],
    [3.90, 1092, 434], [4.15, 1092, 434], [4.85, 1186, 504], [5.35, 1186, 616],
    [5.65, 1186, 616], [6.35, 1186, 616], [6.90, 1772, 968], [7.00, 1772, 968],
    [7.80, 1500, 560], [8.25, 1016, 486], [8.30, 1016, 486], [8.75, 1640, 620],
    [8.90, 1640, 620], [9.45, 1150, 745], [10.30, 1220, 412], [10.45, 1220, 412],
    [10.90, 1396, 920], [10.95, 1396, 920], [11.22, 1542, 920], [11.25, 1542, 920],
    [11.92, -80, 1150], [12.00, -80, 1150]
  ]
  function cursorAt (t) {
    const K = KEYS
    let i = K.length - 2
    for (let j = 0; j < K.length - 1; j++) { if (t >= K[j][0] && t <= K[j + 1][0]) { i = j; break } }
    const p0 = K[Math.max(0, i - 1)], p1 = K[i], p2 = K[i + 1], p3 = K[Math.min(K.length - 1, i + 2)]
    const dt = p2[0] - p1[0] || 1
    const u = clamp((t - p1[0]) / dt, 0, 1)
    const out = []
    for (let k = 1; k <= 2; k++) {
      const m1 = k === 1 ? (p2[k] - p0[k]) / ((p2[0] - p0[0]) || 1) : 0
      const m2 = k === 2 ? (p3[k] - p1[k]) / ((p3[0] - p1[0]) || 1) : 0
      const v1 = p1[k], v2 = p2[k]
      out.push((2 * Math.pow(u, 3) - 3 * u * u + 1) * v1 + (Math.pow(u, 3) - 2 * u * u + u) * dt * m1 +
               (-2 * Math.pow(u, 3) + 3 * u * u) * v2 + (Math.pow(u, 3) - u * u) * dt * m2)
    }
    return out
  }

  const PRESSES = [[2.6, 0.12], [4.15, 0.12], [5.65, 0.12], [7.0, 0.12], [8.3, 0.12], [8.9, 0.12], [10.45, 0.12], [10.95, 0.30]]
  const RIPPLES = [
    [2.6, 1060, 412, '#7be3c3'], [4.15, 1060, 412, '#c983cd'], [5.65, 1186, 616, '#7be3c3'],
    [7.0, 1772, 968, '#7be3c3'], [8.3, 1016, 486, '#7be3c3'], [8.9, 1640, 620, '#7be3c3'],
    [10.45, 1220, 412, '#c983cd'], [10.95, 1396, 920, '#7be3c3']
  ]
  const ringEls = RIPPLES.map(() => {
    const c = document.createElementNS(NS, 'circle')
    c.setAttribute('fill', 'none'); c.setAttribute('stroke-width', '3')
    world.appendChild(c)
    return c
  })

  const HASH = 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0'
  const CAPS = [
    ['01 / 06 · TORRSERVER ++', 'TORRSERVER ++'],
    ['02 / 06 · TORRSERVER ++', 'LEFT CLICK: THE WHOLE PLAYLIST'],
    ['03 / 06 · TORRSERVER ++', 'RIGHT CLICK: ONE EPISODE'],
    ['04 / 06 · TORRSERVER ++', 'THE BADGE KNOWS YOUR CLIPBOARD'],
    ['05 / 06 · TORRSERVER ++', 'ADDED: NAMED AND COVERED'],
    ['06 / 06 · TORRSERVER ++', 'STRAIGHT TO MPV']
  ]
  const capEls = [$('cap0'), $('cap1')]
  function renderCap (el, i, vis, enterS, exitS) {
    if (vis <= 0.005) { el.style.opacity = '0'; return }
    el.innerHTML = '<div class="cap-eyebrow">' + CAPS[i][0] + '</div><div class="cap-text">' + CAPS[i][1] + '</div>'
    el.style.opacity = vis
    el.style.filter = 'blur(' + Math.max(0, 9 * (1 - vis)).toFixed(2) + 'px)'
    el.style.transform = 'translateY(' + (16 * (1 - enterS) - 12 * (1 - exitS)).toFixed(2) + 'px)'
  }

  const fmt = s => { s = Math.round(s); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) }

  function seek (tRaw) {
    const t = ((tRaw % P) + P) % P

    // camera
    const [cx, cy, cw] = camAt(t)
    const vh = cw * 1080 / 1920
    const vx = cx - cw / 2, vy = cy - vh / 2
    world.setAttribute('viewBox', vx + ' ' + vy + ' ' + cw + ' ' + vh)
    const kScreen = cw / 1920
    const w2s = wx => (wx - vx) / kScreen
    const w2sy = wy => (wy - vy) / kScreen

    // copy link label swap
    const ls = chain(t, [[0, 0], [2.6, 1], [3.15, 0], [5.7, 1], [6.3, 0]], )
    const lblBlur = Math.max(0, 6 * Math.min(ls, 1 - ls) * kScreen).toFixed(2)
    $('copyA').setAttribute('opacity', (1 - ls).toFixed(3))
    $('copyA').style.filter = 'blur(' + lblBlur + 'px)'
    $('copyB').setAttribute('opacity', ls.toFixed(3))
    $('copyB').style.filter = 'blur(' + lblBlur + 'px)'

    // episode picker
    const ms = chain(t, [[0, 0], [4.2, 1, 16, 0.62], [5.78, 0, 16, 0.62]])
    const pick = $('picker')
    pick.setAttribute('opacity', Math.min(1, ms * 1.8).toFixed(3))
    pick.setAttribute('transform', 'translate(976 472) scale(' + (0.9 + 0.1 * ms).toFixed(4) + ') translate(-976 -472)')
    const hiTop = chain(t, [[0, 480], [4.9, 480, 17, 0.7], [5.35, 592, 17, 0.7]])
    const hiBot = chain(t, [[0, 528], [4.9, 528, 10, 0.7], [5.35, 640, 10, 0.7]])
    const hi = $('pickHi')
    hi.setAttribute('y', hiTop.toFixed(2)); hi.setAttribute('height', Math.max(0, hiBot - hiTop).toFixed(2))
    hi.setAttribute('opacity', (ms * chain(t, [[0, 0], [4.9, 1, 14, 0.8]])).toFixed(3))
    $('ep3check').setAttribute('opacity', chain(t, [[0, 0], [5.68, 1, 16, 0.8]]).toFixed(3))
    $('ep3text').setAttribute('fill', t >= 5.68 && t < 8 ? '#7be3c3' : '#f1eff3')

    // fab badge
    const bs = chain(t, [[0, 0], [6.4, 1, 18, 0.55], [11.32, 0, 16, 0.7]])
    const fb = $('fabBadge')
    fb.setAttribute('opacity', Math.min(1, bs * 2).toFixed(3))
    fb.setAttribute('transform', 'translate(1800 932) scale(' + Math.max(0.001, bs).toFixed(4) + ') translate(-1800 -932)')

    // quick add dialog
    const ds = chain(t, [[0, 0], [7.25, 1, 15, 0.62], [8.98, 0, 15, 0.62]])
    const dlg = $('dlg')
    dlg.setAttribute('opacity', Math.min(1, ds * 1.8).toFixed(3))
    dlg.setAttribute('transform', 'translate(1360 420) scale(' + (0.90 + 0.10 * ds).toFixed(4) + ') translate(-1360 -420)')
    const rev = smooth((t - 7.45) / 0.6)
    const nch = Math.round(HASH.length * rev)
    $('dlgText').textContent = HASH.slice(0, nch)
    const caret = $('dlgCaret')
    caret.setAttribute('x', (1020 + 3 + nch * 10.54).toFixed(1))
    caret.setAttribute('opacity', (ds > 0.5 && t < 8.9 ? (Math.sin(2 * Math.PI * 2.2 * t) > 0 ? 1 : 0.15) : 0).toFixed(2))
    $('dlgInfo').setAttribute('opacity', chain(t, [[0, 0], [8.1, 1, 14, 0.8], [8.98, 0, 14, 0.8]]).toFixed(3))
    // auto toggle: knob rides a fast spring, track fill lags on a slow one
    const kon = chain(t, [[0, 0], [8.3, 1, 19, 0.6]])
    const kfill = chain(t, [[0, 0], [8.3, 1, 11, 0.7]])
    $('tglKnob').setAttribute('cx', (1016 + 32 * kon).toFixed(2))
    $('tglFill').setAttribute('width', (64 * kfill).toFixed(2))
    $('tglLabel').setAttribute('fill', kfill > 0.5 ? '#f1eff3' : '#a9b2b7')
    $('addFlash').setAttribute('opacity', (0.35 * chain(t, [[0, 0], [8.9, 1, 30, 1], [9.02, 0, 30, 1]])).toFixed(3))

    // toast
    const ts = chain(t, [[0, 0], [9.15, 1, 14, 0.7], [11.42, 0, 14, 0.7]])
    const toast = $('toast')
    toast.setAttribute('opacity', Math.min(1, ts * 1.6).toFixed(3))
    toast.setAttribute('transform', 'translate(' + (240 * (1 - ts)).toFixed(2) + ' 0)')

    // card 2 rename swap
    const s2 = chain(t, [[0, 0], [9.55, 1, 18, 1], [11.38, 0, 18, 1]])
    const blur2 = Math.max(0, 8 * Math.min(s2, 1 - s2) * kScreen).toFixed(2)
    $('c2titleA').setAttribute('opacity', (1 - s2).toFixed(3))
    $('c2titleA').style.filter = 'blur(' + blur2 + 'px)'
    $('c2titleB').setAttribute('opacity', s2.toFixed(3))
    $('c2titleB').style.filter = 'blur(' + blur2 + 'px)'
    $('c2hashGlyph').setAttribute('opacity', (1 - s2).toFixed(3))
    const mp = $('c2mintPoster')
    mp.setAttribute('opacity', s2.toFixed(3))
    mp.setAttribute('transform', 'translate(576 730) scale(' + (0.94 + 0.06 * s2).toFixed(4) + ') translate(-576 -730)')
    $('c2prog').setAttribute('width', (8 + 332 * s2).toFixed(1))
    $('c2prog').setAttribute('opacity', (0.3 + 0.45 * s2).toFixed(2))

    // player
    const ps = chain(t, [[0, 0], [10.45, 1, 15, 0.6], [11.32, 0, 15, 0.6]])
    const pl = $('player')
    pl.setAttribute('opacity', Math.min(1, ps * 1.6).toFixed(3))
    pl.setAttribute('transform', 'translate(' + (560 * (1 - ps)).toFixed(2) + ' 0)')
    let val
    const cur = cursorAt(t)
    if (t >= 10.95 && t < 11.25) val = clamp((cur[0] - 1240) / 520, 0.30, 0.9)
    else if (t >= 11.25) val = Math.min(0.9, 0.581 + 0.05 * (t - 11.25))
    else val = 0.30 + 0.04 * Math.max(0, t - 10.5)
    $('playFill').setAttribute('width', (520 * val).toFixed(1))
    $('playKnob').setAttribute('cx', (1240 + 520 * val).toFixed(1))
    $('playTime').textContent = fmt(val * 1471) + ' / 24:31'
    for (let i = 0; i < 5; i++) {
      const h = 12 + 26 * (0.5 + 0.5 * Math.sin(3.1 * t + i * 1.3))
      $('eq' + i).setAttribute('height', h.toFixed(1))
      $('eq' + i).setAttribute('y', (800 - h).toFixed(1))
    }
    $('liveDot').setAttribute('opacity', (0.4 + 0.6 * (0.5 + 0.5 * Math.sin(2 * Math.PI * 1.2 * t))).toFixed(2))

    // click ripples (world layer, radius compensated for zoom)
    RIPPLES.forEach((r, i) => {
      const age = t - r[0]
      const el = ringEls[i]
      if (age < 0 || age > 0.5) { el.setAttribute('opacity', '0'); return }
      el.setAttribute('cx', r[1]); el.setAttribute('cy', r[2])
      el.setAttribute('r', (14 + 70 * easeOutC(age / 0.45) * kScreen).toFixed(1))
      el.setAttribute('stroke', r[3])
      el.setAttribute('opacity', (0.8 * (1 - age / 0.45)).toFixed(2))
    })

    // screen chrome: captions + cursor
    let idx = t >= 11.6 ? 0 : Math.min(5, Math.floor(t / 2))
    const prev = idx === 0 ? (t >= 11.6 ? 5 : 0) : idx - 1
    const enterAge = i => i === 0 ? t + 0.45 : t - 2 * i
    const exitStart = i => i === 5 ? 11.45 : 1.9 + 2 * i
    function capVis (i) {
      const sin = S(enterAge(i), 14, 0.68)
      const dtOut = exitStart(i) - t + (i === 0 && t >= 11.6 ? 12 : 0)
      const sout = S(dtOut, 22, 1)
      return [sin * sout, sin, sout]
    }
    const [vNew, eN, xN] = capVis(idx)
    const [vOld, eO, xO] = capVis(prev)
    renderCap(capEls[0], idx, vNew, eN, xN)
    renderCap(capEls[1], prev, prev === idx ? 0 : vOld, eO, xO)

    let press = 0
    for (const p of PRESSES) press = Math.max(press, chain(t, [[0, 0], [p[0], 1, 30, 1], [p[0] + p[1], 0, 30, 1]]))
    const sx = w2s(cur[0]), sy = w2sy(cur[1])
    $('cur').style.transform = 'translate(' + (sx - 3).toFixed(1) + 'px,' + (sy - 2).toFixed(1) + 'px) scale(' + (1 - 0.18 * press).toFixed(3) + ')'
    $('cur').style.transformOrigin = '3px 2px'
  }

  window.seek = seek
  seek(0)
  if (new URLSearchParams(location.search).has('play')) {
    const t0 = performance.now()
    const loop = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop) }
    requestAnimationFrame(loop)
  }
})()
</script>
</body>
</html>
