<script>
(function () {
  'use strict'
  const P = 18
  const $ = id => document.getElementById(id)
  const world = $('world')
  const NS = 'http://www.w3.org/2000/svg'

  function S (u, w, z) {
    if (u <= 0) return 0
    if (u > 4 / w) return 1
    if (z >= 1) return 1 - Math.exp(-w * u) * (1 + w * u)
    const wd = w * Math.sqrt(1 - z * z)
    return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + (z * w / wd) * Math.sin(wd * u))
  }
  function chain (t, keys) {
    let v = keys[0][1]
    for (let i = 1; i < keys.length; i++) {
      if (t >= keys[i][0]) v += (keys[i][1] - keys[i - 1][1]) * S(t - keys[i][0], keys[i][2] || 14, keys[i][3] || 0.68)
    }
    return v
  }
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v))
  const smooth = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u) }
  const easeOutC = u => { u = clamp(u, 0, 1); return 1 - Math.pow(1 - u, 3) }

  const CAM = [
    [0.00, 960, 540, 1920, 8],
    [1.40, 1400, 780, 1200, 6],
    [2.70, 1360, 430, 1150, 6],
    [5.90, 1100, 560, 1450, 6],
    [8.60, 1080, 430, 1200, 6],
    [12.20, 1080, 470, 1300, 6],
    [14.90, 1240, 440, 1250, 6],
    [15.60, 1500, 780, 1150, 6.5],
    [16.55, 960, 540, 1920, 13, 0.95]
  ]
  function camAt (t) {
    const out = [960, 540, 1920]
    for (let i = 1; i < CAM.length; i++) {
      if (t >= CAM[i][0]) {
        const s = S(t - CAM[i][0], CAM[i][4], CAM[i][5] || 0.85)
        for (let k = 0; k < 3; k++) out[k] += (CAM[i][k + 1] - CAM[i - 1][k + 1]) * s
      }
    }
    return out
  }

  const KEYS = [
    [0.00, -80, 1150], [1.00, 650, 650], [2.00, 1772, 968], [2.20, 1772, 968],
    [3.60, 1016, 486], [4.50, 1016, 486],
    [5.10, 1640, 620], [5.20, 1640, 620],
    [6.80, 1150, 600],
    [9.20, 1092, 434], [9.60, 1092, 434], [9.95, 950, 480], [10.40, 950, 480],
    [10.85, 1092, 434], [10.90, 1092, 434],
    [11.90, 1186, 504], [12.40, 1186, 616], [12.70, 1186, 616],
    [13.85, 1092, 434], [13.90, 1220, 412], [13.95, 1220, 412],
    [14.80, 1186, 504], [15.10, 1186, 616], [15.35, 1186, 616],
    [16.05, 1396, 920], [16.20, 1396, 920], [16.50, 1542, 920], [16.53, 1542, 920],
    [17.90, -80, 1150], [18.00, -80, 1150]
  ]
  function cursorAt (t) {
    const K = KEYS
    let i = K.length - 2
    for (let j = 0; j < K.length - 1; j++) { if (t >= K[j][0] && t <= K[j + 1][0]) { i = j; break } }
    const p0 = K[Math.max(0, i - 1)], p1 = K[i], p2 = K[i + 1], p3 = K[Math.min(K.length - 1, i + 2)]
    const dt = p2[0] - p1[0] || 1
    const u = clamp((t - p1[0]) / dt, 0, 1)
    const out = []
    for (let k = 1; k <= 2; k++) {
      const m1 = (p2[k] - p0[k]) / ((p2[0] - p0[0]) || 1)
      const m2 = (p3[k] - p1[k]) / ((p3[0] - p1[0]) || 1)
      out.push((2 * Math.pow(u, 3) - 3 * u * u + 1) * p1[k] + (Math.pow(u, 3) - 2 * u * u + u) * dt * m1 +
               (-2 * Math.pow(u, 3) + 3 * u * u) * p2[k] + (Math.pow(u, 3) - u * u) * dt * m2)
    }
    return out
  }

  const PRESSES = [
    [2.2, 'L', 0.26], [4.5, 'L', 0.26], [5.2, 'L', 0.26], [9.6, 'L', 0.26],
    [10.9, 'R', 0.3], [12.7, 'L', 0.26], [13.9, 'R', 0.3], [15.35, 'L', 0.26], [16.15, 'L', 0.33]

  const RIPPLES = [
    [2.2, 1772, 968, '#7be3c3'], [4.5, 1016, 486, '#7be3c3'], [5.2, 1640, 620, '#7be3c3'],
    [9.6, 1060, 412, '#7be3c3'], [10.9, 1060, 412, '#c983cd'], [12.7, 1186, 616, '#7be3c3'],
    [13.9, 1220, 412, '#c983cd'], [15.35, 1186, 616, '#7be3c3'], [16.2, 1396, 920, '#7be3c3']

  const ringEls = RIPPLES.map(() => {
    const c = document.createElementNS(NS, 'circle')
    c.setAttribute('fill', 'none'); c.setAttribute('stroke-width', '3')
    world.appendChild(c)
    return c
  })

  const HASH = 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0'
  const CAPS = [
    ['01 / 06 · TORRSERVER ++', 'TORRSERVER ++'],
    ['02 / 06 · TORRSERVER ++', 'PASTE A HASH, GET A MAGNET'],
    ['03 / 06 · TORRSERVER ++', 'ADDED: NAMED AND COVERED'],
    ['04 / 06 · TORRSERVER ++', 'LEFT CLICK: THE WHOLE PLAYLIST'],
    ['05 / 06 · TORRSERVER ++', 'RIGHT CLICK: ONE EPISODE'],
    ['06 / 06 · TORRSERVER ++', 'RIGHT CLICK: PLAY ONE EPISODE']
  ]
  const CAP_ENTER = [16.9, 2.5, 5.5, 8.5, 10.5, 13.5]
  const CAP_EXIT = [2.4, 5.4, 8.4, 10.4, 13.4, 16.75]
  const capEls = [$('cap0'), $('cap1')]
  function renderCap (el, i, vis, enterS, exitS) {
    if (vis <= 0.005) { el.style.opacity = '0'; return }
    el.innerHTML = '<div class="cap-eyebrow">' + CAPS[i][0] + '</div><div class="cap-text">' + CAPS[i][1] + '</div>'
    el.style.opacity = Math.min(1, vis).toFixed(3)
    el.style.filter = 'blur(' + Math.max(0, 9 * (1 - vis)).toFixed(2) + 'px)'
    el.style.transform = 'translateY(' + (16 * (1 - enterS) - 12 * (1 - exitS)).toFixed(2) + 'px)'
  }

  const fmt = s => { s = Math.round(s); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) }

  function seek (tRaw) {
    const t = ((tRaw % P) + P) % P

    const [cx, cy, cw] = camAt(t)
    const vh = cw * 1080 / 1920
    const vx = cx - cw / 2, vy = cy - vh / 2
    world.setAttribute('viewBox', vx + ' ' + vy + ' ' + cw + ' ' + vh)
    const kScreen = cw / 1920
    const w2s = wx => (wx - vx) / kScreen
    const w2sy = wy => (wy - vy) / kScreen

    // copy link label: masked slide-up swap, no overlap
    const yA = chain(t, [[0, 420], [9.6, 372, 16, 1], [13.15, 420, 16, 1]])
    const yB = chain(t, [[0, 468], [9.6, 420, 16, 1], [13.15, 468, 16, 1]])
    $('copyA').setAttribute('y', yA.toFixed(2))
    $('copyB').setAttribute('y', yB.toFixed(2))

    // episode picker (opens twice: copy, then play)
    const ms = chain(t, [[0, 0], [11.0, 1, 16, 0.62], [13.1, 0, 20, 0.7], [14.15, 1, 16, 0.62], [16.2, 0, 20, 0.7]])
    const pick = $('picker')
    pick.setAttribute('opacity', Math.min(1, ms * 1.8).toFixed(3))
    pick.setAttribute('transform', 'translate(976 472) scale(' + (0.9 + 0.1 * ms).toFixed(4) + ') translate(-976 -472)')
    const hiTop = chain(t, [[0, 480], [11.9, 480, 17, 0.7], [12.4, 592, 17, 0.7], [14.8, 480, 17, 0.7], [15.1, 592, 17, 0.7]])
    const hiBot = chain(t, [[0, 528], [11.9, 528, 10, 0.7], [12.4, 640, 10, 0.7], [14.8, 528, 10, 0.7], [15.1, 640, 10, 0.7]])
    const hi = $('pickHi')
    hi.setAttribute('y', hiTop.toFixed(2)); hi.setAttribute('height', Math.max(0, hiBot - hiTop).toFixed(2))
    hi.setAttribute('opacity', (ms * chain(t, [[0, 0], [11.5, 1, 14, 0.8]])).toFixed(3))
    $('ep3check').setAttribute('opacity', chain(t, [[0, 0], [12.72, 1, 16, 0.8]]).toFixed(3))
    $('ep3text').setAttribute('fill', t >= 12.72 ? '#7be3c3' : '#f1eff3')

    // fab badge
    const bs = chain(t, [[0, 0], [1.2, 1, 18, 0.55], [17.0, 0, 16, 0.85]])
    const fb = $('fabBadge')
    fb.setAttribute('opacity', Math.min(1, bs * 2).toFixed(3))
    fb.setAttribute('transform', 'translate(1800 932) scale(' + Math.max(0.001, bs).toFixed(4) + ') translate(-1800 -932)')

    // quick add dialog
    const ds = chain(t, [[0, 0], [2.45, 1, 15, 0.62], [5.45, 0, 15, 0.8]])
    const dlg = $('dlg')
    dlg.setAttribute('opacity', Math.min(1, ds * 1.8).toFixed(3))
    dlg.setAttribute('transform', 'translate(1360 420) scale(' + (0.90 + 0.10 * ds).toFixed(4) + ') translate(-1360 -420)')
    const rev = smooth((t - 2.9) / 1.1)
    const nch = Math.round(HASH.length * rev)
    $('dlgText').textContent = HASH.slice(0, nch)
    const caret = $('dlgCaret')
    caret.setAttribute('x', (1020 + 3 + nch * 10.54).toFixed(1))
    caret.setAttribute('opacity', (ds > 0.5 && t < 5.2 ? (Math.sin(2 * Math.PI * 2.2 * t) > 0 ? 1 : 0.15) : 0).toFixed(2))
    $('dlgInfo').setAttribute('opacity', chain(t, [[0, 0], [4.15, 1, 14, 0.8], [5.45, 0, 14, 0.8]]).toFixed(3))
    const kon = chain(t, [[0, 0], [4.5, 1, 19, 0.6]])
    const kfill = chain(t, [[0, 0], [4.5, 1, 11, 0.7]])
    $('tglKnob').setAttribute('cx', (1016 + 32 * kon).toFixed(2))
    $('tglFill').setAttribute('width', (64 * Math.min(1, kfill)).toFixed(2))
    $('tglLabel').setAttribute('fill', kfill > 0.5 ? '#f1eff3' : '#a9b2b7')
    $('addFlash').setAttribute('opacity', (0.35 * chain(t, [[0, 0], [5.2, 1, 30, 1], [5.32, 0, 30, 1]])).toFixed(3))

    // toast
    const ts = chain(t, [[0, 0], [5.6, 1, 14, 0.7], [7.6, 0, 16, 0.85]])
    const toast = $('toast')
    toast.setAttribute('opacity', Math.min(1, ts * 1.6).toFixed(3))
    toast.setAttribute('transform', 'translate(' + (240 * (1 - ts)).toFixed(2) + ' 0)')

    // added card: slides in, hash swaps to clean name + cover, exits before the loop closes
    const ain = chain(t, [[0, 0], [5.8, 1, 15, 0.62], [17.4, 0, 14, 0.9]])
    const aout = chain(t, [[0, 0], [17.4, 1, 14, 0.9]])
    const ac = $('addCard')
    ac.setAttribute('opacity', Math.max(0, Math.min(1, ain * 1.6 * (1 - aout))).toFixed(3))
    ac.setAttribute('transform', 'translate(0 ' + (48 * (1 - ain) + 40 * aout).toFixed(2) + ')')
    const s2 = chain(t, [[0, 0], [6.9, 1, 14, 0.8]])
    const blur2 = Math.max(0, 8 * Math.min(s2, 1 - s2) * kScreen).toFixed(2)
    $('a2titleA').setAttribute('opacity', (1 - Math.min(1, s2)).toFixed(3))
    $('a2titleA').style.filter = 'blur(' + blur2 + 'px)'
    $('a2titleB').setAttribute('opacity', Math.min(1, s2).toFixed(3))
    $('a2titleB').style.filter = 'blur(' + blur2 + 'px)'
    $('a2hashGlyph').setAttribute('opacity', (1 - Math.min(1, s2)).toFixed(3))
    const cv = $('a2cover')
    cv.setAttribute('opacity', Math.min(1, s2).toFixed(3))
    cv.setAttribute('transform', 'translate(576 346) scale(' + (0.94 + 0.06 * Math.min(1, s2)).toFixed(4) + ') translate(-576 -346)')
    $('a2prog').setAttribute('width', (8 + 332 * Math.min(1, s2)).toFixed(1))
    $('a2prog').setAttribute('opacity', (0.3 + 0.45 * Math.min(1, s2)).toFixed(2))
    $('emptyHint').setAttribute('opacity', chain(t, [[0, 1], [5.7, 0, 14, 0.8], [17.0, 1, 14, 0.8]]).toFixed(3))

    // player
    const ps = chain(t, [[0, 0], [15.55, 1, 15, 0.62], [16.6, 0, 15, 0.8]])
    const pl = $('player')
    pl.setAttribute('opacity', Math.min(1, ps * 1.6).toFixed(3))
    pl.setAttribute('transform', 'translate(' + (560 * (1 - ps)).toFixed(2) + ' 0)')
    let val
    const cur = cursorAt(t)
    if (t >= 16.2 && t < 16.53) val = clamp((cur[0] - 1240) / 520, 0.30, 0.9)
    else if (t >= 16.53) val = Math.min(0.9, 0.581 + 0.05 * (t - 16.53))
    else val = 0.30 + 0.04 * Math.max(0, t - 15.6)
    $('playFill').setAttribute('width', (520 * val).toFixed(1))
    $('playKnob').setAttribute('cx', (1240 + 520 * val).toFixed(1))
    $('playTime').textContent = fmt(val * 1471) + ' / 24:31'
    for (let i = 0; i < 5; i++) {
      const h = 12 + 26 * (0.5 + 0.5 * Math.sin(3.1 * t + i * 1.3))
      $('eq' + i).setAttribute('height', h.toFixed(1))
      $('eq' + i).setAttribute('y', (800 - h).toFixed(1))
    }
    $('liveDot').setAttribute('opacity', (0.4 + 0.6 * (0.5 + 0.5 * Math.sin(2 * Math.PI * 1.2 * t))).toFixed(2))

    // click ripples (world layer, zoom compensated)
    RIPPLES.forEach((r, i) => {
      const age = t - r[0]
      const el = ringEls[i]
      if (age < 0 || age > 0.9) { el.setAttribute('opacity', '0'); return }
      el.setAttribute('cx', r[1]); el.setAttribute('cy', r[2])
      el.setAttribute('r', (14 + 85 * easeOutC(age / 0.9) * kScreen).toFixed(1))
      el.setAttribute('stroke', r[3])
      el.setAttribute('opacity', (0.85 * (1 - age / 0.9)).toFixed(2))
    })

    // screen chrome: captions + mouse
    let idx
    if (t >= 16.9) idx = 0
    else if (t < 2.5) idx = 0
    else if (t < 5.5) idx = 1
    else if (t < 8.5) idx = 2
    else if (t < 10.5) idx = 3
    else if (t < 13.5) idx = 4
    else idx = 5
    const prev = idx === 0 ? (t >= 16.9 ? 5 : 0) : idx - 1
    function capVis (i) {
      const enterA = i === 0 ? (t >= 16.9 ? t - 16.9 : t + (P - 16.9)) : t - CAP_ENTER[i]
      const sin = S(enterA, 16, 0.75)
      let dtOut = CAP_EXIT[i] - t
      if (i === 0 && t >= 16.9) dtOut += P
      const sout = S(dtOut, 22, 1)
      return [sin * sout, sin, sout]
    }
    const [vNew, eN, xN] = capVis(idx)
    const [vOld, eO, xO] = capVis(prev)
    renderCap(capEls[0], idx, vNew, eN, xN)
    renderCap(capEls[1], prev, prev === idx ? 0 : vOld, eO, xO)

    let press = 0, glowL = 0, glowR = 0
    for (const p of PRESSES) {
      const env = chain(t, [[0, 0], [p[0], 1, 24, 1], [p[0] + 0.1, 1, 24, 1], [p[0] + p[2], 0, 24, 1]])
      press = Math.max(press, env)
      if (p[1] === 'L') glowL = Math.max(glowL, env)
      else glowR = Math.max(glowR, env)
    }
    $('mbtnL').setAttribute('opacity', glowL.toFixed(3))
    $('mbtnR').setAttribute('opacity', glowR.toFixed(3))
    const sx = w2s(cur[0]), sy = w2sy(cur[1])
    $('cur').style.transform = 'translate(' + (sx - 30).toFixed(1) + 'px,' + (sy - 46).toFixed(1) + 'px) scale(' + (1 - 0.10 * press).toFixed(3) + ')'
    $('cur').style.transformOrigin = '30px 46px'
  }

  window.seek = seek
  seek(0)
  if (new URLSearchParams(location.search).has('play')) {
    const t0 = performance.now()
    const loop = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop) }
    requestAnimationFrame(loop)
  }
})()
</script>
</body>
</html>
