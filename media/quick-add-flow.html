<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From raw hash to named, covered torrent</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #212324;
      --color-ink:     #f1eff3;
      --color-muted:   #a9b2b7;
      --color-soft:    #8a949a;
      --color-accent:  #7be3c3;
      --color-link:    #c983cd;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">TorrServer ++ · Quick Add</p>
    <h1>From raw hash to named, covered torrent</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quick-add-flow-title quick-add-flow-desc">
        <title id="quick-add-flow-title">Quick add flow</title>
        <desc id="quick-add-flow-desc">Flow of the Quick add feature: a pasted hash or magnet gets trackers appended, is added to the TorrServer API, and an optional auto step cleans the title and fetches a cover before the torrent card is updated.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9b2b7"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7be3c3"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#212324"/>

        <!-- arrows first -->
        <line x1="204" y1="272" x2="252" y2="272" stroke="#a9b2b7" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="372" y1="272" x2="420" y2="272" stroke="#7be3c3" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="540" y1="272" x2="588" y2="272" stroke="#a9b2b7" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="708" y1="272" x2="756" y2="272" stroke="#a9b2b7" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 480 240 L 480 184 Q 480 176 488 176 L 808 176 Q 816 176 816 184 L 816 240" fill="none" stroke="#a9b2b7" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- accent arrow label -->
        <rect x="378" y="252" width="36" height="12" rx="2" fill="#212324"/>
        <text x="396" y="261" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#7be3c3" text-anchor="middle">ADD</text>

        <!-- nodes -->
        <rect x="84" y="240" width="120" height="64" rx="6" fill="#212324"/>
        <rect x="84" y="240" width="120" height="64" rx="6" fill="rgba(169,178,183,0.10)" stroke="#8a949a" stroke-width="1"/>
        <rect x="92" y="246" width="40" height="12" rx="2" fill="transparent" stroke="rgba(138,148,154,0.40)" stroke-width="0.8"/>
        <text x="112" y="255" fill="rgba(138,148,154,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIALOG</text>
        <text x="144" y="274" fill="#f1eff3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quick add</text>
        <text x="144" y="290" fill="#a9b2b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">paste · preview</text>

        <rect x="252" y="240" width="120" height="64" rx="6" fill="#212324"/>
        <rect x="252" y="240" width="120" height="64" rx="6" fill="rgba(123,227,195,0.10)" stroke="#7be3c3" stroke-width="1"/>
        <rect x="260" y="246" width="36" height="12" rx="2" fill="transparent" stroke="rgba(123,227,195,0.40)" stroke-width="0.8"/>
        <text x="278" y="255" fill="rgba(123,227,195,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUILD</text>
        <text x="312" y="274" fill="#f1eff3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Magnet builder</text>
        <text x="312" y="290" fill="#a9b2b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ tracker list</text>

        <rect x="420" y="240" width="120" height="64" rx="6" fill="#212324"/>
        <rect x="420" y="240" width="120" height="64" rx="6" fill="rgba(241,239,243,0.05)" stroke="#a9b2b7" stroke-width="1"/>
        <rect x="428" y="246" width="28" height="12" rx="2" fill="transparent" stroke="rgba(169,178,183,0.40)" stroke-width="0.8"/>
        <text x="442" y="255" fill="rgba(169,178,183,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="480" y="274" fill="#f1eff3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TorrServer</text>
        <text x="480" y="290" fill="#a9b2b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /torrents</text>

        <rect x="588" y="240" width="120" height="64" rx="6" fill="#212324"/>
        <rect x="588" y="240" width="120" height="64" rx="6" fill="rgba(241,239,243,0.02)" stroke="rgba(241,239,243,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="596" y="246" width="32" height="12" rx="2" fill="transparent" stroke="rgba(241,239,243,0.30)" stroke-width="0.8"/>
        <text x="612" y="255" fill="rgba(241,239,243,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTO</text>
        <text x="648" y="274" fill="#f1eff3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auto fix</text>
        <text x="648" y="290" fill="#a9b2b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clean name · cover</text>
        <text x="648" y="330" fill="#8a949a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TMDB → ANILIST → ITUNES</text>

        <rect x="756" y="240" width="120" height="64" rx="6" fill="#212324"/>
        <rect x="756" y="240" width="120" height="64" rx="6" fill="rgba(241,239,243,0.05)" stroke="#a9b2b7" stroke-width="1"/>
        <rect x="764" y="246" width="32" height="12" rx="2" fill="transparent" stroke="rgba(169,178,183,0.40)" stroke-width="0.8"/>
        <text x="780" y="255" fill="rgba(169,178,183,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DONE</text>
        <text x="816" y="274" fill="#f1eff3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Torrent card</text>
        <text x="816" y="290" fill="#a9b2b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">title · poster</text>

        <!-- callout -->
        <text x="84" y="470" font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#f1eff3">auto mode also fixes torrents that are already on the server</text>
        <path d="M 356 456 Q 520 440 648 314" fill="none" stroke="rgba(241,239,243,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="648" cy="312" r="2" fill="#f1eff3"/>

        <!-- legend -->
        <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(241,239,243,0.10)" stroke-width="0.8"/>
        <text x="40" y="572" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#a9b2b7">LEGEND</text>
        <line x1="120" y1="569" x2="160" y2="569" stroke="#7be3c3" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="168" y="572" font-family="'Geist Mono', monospace" font-size="8" fill="#8a949a">ADD TO YOUR SERVER</text>
        <line x1="300" y1="569" x2="340" y2="569" stroke="#a9b2b7" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="348" y="572" font-family="'Geist Mono', monospace" font-size="8" fill="#8a949a">OPTIONAL AUTO FIX</text>
        <rect x="480" y="562" width="16" height="10" rx="2" fill="rgba(123,227,195,0.10)" stroke="#7be3c3" stroke-width="0.8"/>
        <text x="504" y="572" font-family="'Geist Mono', monospace" font-size="8" fill="#8a949a">RUNS IN YOUR BROWSER</text>
        <line x1="660" y1="569" x2="700" y2="569" stroke="#a9b2b7" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="708" y="572" font-family="'Geist Mono', monospace" font-size="8" fill="#8a949a">SERVER SIDE</text>
      </svg>
    </div>
  </div>
</body>
</html>
